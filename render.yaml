# Render Blueprint para el backend NestJS.

services:
  - type: web
    name: whoami-api
    runtime: node
    rootDir: backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    buildCommand: bun install && bunx prisma generate && bun run build
    startCommand: bunx prisma migrate deploy && bun run start:prod
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: RAWG_API_KEY
        sync: false
      - key: SPORTSDB_API_KEY
        value: "3"

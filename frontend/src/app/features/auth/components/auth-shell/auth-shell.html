<div class="ov" [class.open]="open()" [class.ready]="ready()">
  <div class="ov-behind" inert aria-hidden="true">
    <app-landing-page
      [style.transform]="'translateY(-' + bgOffset() + 'px) scale(1.02)'"
    />
  </div>

  <button type="button" class="ov-scrim" aria-label="Cerrar" (click)="close()"></button>

  <aside class="ov-drawer" role="dialog" aria-modal="true">
    <div class="drawer-scroll">
      <button type="button" class="drawer-x" (click)="close()" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>

      <div class="drawer-inner">
        <a routerLink="/" class="drawer-brand">whoami<span>?</span></a>

        <div class="head">
          @if (eyebrow) { <p class="eyebrow">{{ eyebrow }}</p> }
          <h1>{{ heading }}</h1>
          @if (sub) { <p class="sub muted">{{ sub }}</p> }
        </div>

        <ng-content></ng-content>
      </div>
    </div>
  </aside>
</div>

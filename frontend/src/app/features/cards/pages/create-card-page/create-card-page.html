<section class="page create-card">
  <header class="create-head">
    <div>
      <p class="eyebrow">Nueva card</p>
      <h1>Empieza por lo básico</h1>
      <p class="muted">Después le añades favoritos, colores y preview en el editor.</p>
    </div>
    <a routerLink="/dashboard" class="btn btn-ghost btn-sm">Cancelar</a>
  </header>

  <form class="card create-form" (ngSubmit)="onSubmit()">
    <label>
      <span>Nombre</span>
      <input [(ngModel)]="name" name="name" placeholder="Ej. Gerar" required>
    </label>

    <label>
      <span>Descripción <span class="opt">(opcional)</span></span>
      <textarea [(ngModel)]="description" name="description" rows="3" maxlength="180" placeholder="Una frase que te describa"></textarea>
    </label>

    @if (needsBirthDate()) {
      <label>
        <span>Fecha de nacimiento</span>
        <input [(ngModel)]="birthDate" name="birthDate" type="date" required>
      </label>
    }

    <div class="form-row">
      <label>
        <span>Layout</span>
        <select [(ngModel)]="layout" name="layout">
          <option value="VERTICAL">Vertical (9:16)</option>
          <option value="SQUARE">Cuadrado (1:1)</option>
          <option value="HORIZONTAL">Horizontal (16:9)</option>
        </select>
      </label>

      <label>
        <span>Template</span>
        <select [(ngModel)]="template" name="template">
          <option value="DARK">Ficha</option>
          <option value="LIGHT">Editorial</option>
          <option value="MINIMAL">Póster</option>
          <option value="NEON">Etiqueta</option>
        </select>
      </label>
    </div>

    @if (error()) {
      <p class="form-error">{{ error() }}</p>
    }

    <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
      {{ loading() ? 'Creando…' : 'Crear y abrir editor' }}
    </button>
  </form>
</section>

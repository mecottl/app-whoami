<section class="page create-card">
  <header class="create-head">
    <div>
      <p class="eyebrow">Nueva card</p>
      <h1>Empieza por lo básico</h1>
      <p class="muted">Después le añades favoritos, colores y preview en el editor.</p>
    </div>
    <a routerLink="/dashboard" class="btn btn-ghost btn-sm">Cancelar</a>
  </header>

  <form class="card create-form" (ngSubmit)="onSubmit()">
    <label>
      <span>Nombre</span>
      <input [(ngModel)]="name" name="name" placeholder="Ej. Gerar" required>
    </label>

    <label>
      <span>Descripción <span class="opt">(opcional, máx. 100 palabras)</span></span>
      <textarea [(ngModel)]="description" name="description" rows="3" maxlength="700" class="no-resize" placeholder="Una frase que te describa"></textarea>
    </label>

    @if (needsBirthDate()) {
      <label>
        <span>Fecha de nacimiento</span>
        <input [(ngModel)]="birthDate" name="birthDate" type="date" required>
      </label>
    }

    <label>
      <span>Layout</span>
      <select [(ngModel)]="layout" name="layout">
        @for (l of layouts; track l.value) {
          <option [value]="l.value">{{ l.label }}</option>
        }
      </select>
    </label>

    <label>
      <span>Plantilla <span class="opt">(la cambias luego)</span></span>
      <select [(ngModel)]="template" name="template">
        @for (t of templates; track t.value) {
          <option [value]="t.value">{{ t.label }}</option>
        }
      </select>
    </label>

    @if (error()) {
      <p class="form-error">{{ error() }}</p>
    }

    <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
      {{ loading() ? 'Creando…' : 'Crear y abrir editor' }}
    </button>
  </form>
</section>

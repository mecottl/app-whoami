<header class="site-header">
  <a class="brand" [routerLink]="brandLink()">
    <span class="brand-mark" aria-hidden="true">W</span>
    <span class="brand-word">WhoAmI</span>
    <span class="brand-dim">Studio</span>
  </a>

  <nav class="site-nav">
    @if (isAuthed()) {
      <a class="nav-link" routerLink="/dashboard">Cards</a>
      <button type="button" class="btn btn-ghost btn-sm" (click)="logout()">Salir</button>
    } @else if (!onAuthRoute()) {
      <a class="nav-link" routerLink="/login">Entrar</a>
      <a class="btn btn-primary btn-sm" routerLink="/register">Empezar</a>
    }

    <button
      type="button"
      class="icon-btn"
      (click)="toggleTheme()"
      [attr.aria-label]="'Cambiar a tema ' + (theme.resolved() === 'dark' ? 'claro' : 'oscuro')"
      title="Cambiar tema"
    >
      @if (theme.resolved() === 'dark') {
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      }
    </button>
  </nav>
</header>

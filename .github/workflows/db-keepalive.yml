name: db-keepalive

# Supabase pausa los proyectos del plan free tras ~7 días sin actividad.
# Este job pega al endpoint /health del backend cada 3 días; ese endpoint
# ejecuta un `SELECT 1` real contra la base, así que cuenta como actividad.
#
# Requiere un secret del repo:
#   KEEPALIVE_URL = https://whoami-api.onrender.com/health   (tu URL de Render)

on:
  schedule:
    - cron: "0 8 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health (despierta Render y toca Supabase)
        run: |
          curl -fsS --max-time 120 --retry 6 --retry-delay 30 --retry-all-errors \
            "${{ secrets.KEEPALIVE_URL }}"
          echo
